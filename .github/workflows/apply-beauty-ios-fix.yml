name: Apply iPhone Beauty Blur Fix

on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/apply-beauty-ios-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'main';
            const api = github.rest.repos;

            async function getFile(path) {
              const r = await api.getContent({ owner, repo, path, ref: branch });
              if (Array.isArray(r.data)) throw new Error(`Expected file: ${path}`);
              return {
                sha: r.data.sha,
                content: Buffer.from(r.data.content, 'base64').toString('utf8'),
              };
            }

            async function putFile(path, content, sha, message) {
              await api.createOrUpdateFileContents({
                owner, repo, path, branch, sha,
                message,
                content: Buffer.from(content, 'utf8').toString('base64'),
              });
            }

            const blurContent = [
              'export const SUPPORTS_CTX_FILTER = (() => {',
              '  try {',
              '    const c = document.createElement("canvas");',
              '    c.width = c.height = 2;',
              '    const x = c.getContext("2d")!;',
              '    x.filter = "grayscale(1)";',
              '    x.fillStyle = "#f00";',
              '    x.fillRect(0, 0, 2, 2);',
              '    const d = x.getImageData(0, 0, 1, 1).data;',
              '    return d[0] === d[1];',
              '  } catch { return false; }',
              '})();',
              '',
              'export function blurInto(dst: CanvasRenderingContext2D, src: HTMLCanvasElement, radius: number, w: number, h: number) {',
              '  if (SUPPORTS_CTX_FILTER) {',
              '    dst.filter = `blur(${radius.toFixed(1)}px)`;',
              '    dst.drawImage(src, 0, 0);',
              '    dst.filter = "none";',
              '    return;',
              '  }',
              '  const k = Math.max(2, radius);',
              '  const sw = Math.max(1, Math.round(w / k)), sh = Math.max(1, Math.round(h / k));',
              '  const tmp = document.createElement("canvas");',
              '  tmp.width = sw; tmp.height = sh;',
              '  const t = tmp.getContext("2d")!;',
              '  t.imageSmoothingQuality = "high";',
              '  t.drawImage(src, 0, 0, sw, sh);',
              '  dst.imageSmoothingEnabled = true;',
              '  dst.imageSmoothingQuality = "high";',
              '  dst.drawImage(tmp, 0, 0, sw, sh, 0, 0, w, h);',
              '}',
              '',
            ].join('\n');

            await api.createOrUpdateFileContents({
              owner, repo, path: 'client/src/features/beauty/canvasBlur.ts', branch,
              message: 'fix: add shared iPhone-safe beauty blur fallback',
              content: Buffer.from(blurContent, 'utf8').toString('base64'),
            });

            let face = await getFile('client/src/features/beauty/FaceEffects.ts');
            let fs = face.content;
            fs = fs.replace(
              'import { LM, getFaceGeometry, getPoints } from "@/components/faceUtils";\n',
              'import { LM, getFaceGeometry, getPoints } from "@/components/faceUtils";\nimport { blurInto } from "./canvasBlur";\n'
            );
            const blush = [
              'function blush(ctx: CanvasRenderingContext2D, c: Point, rx: number, ry: number, rgb: string, alpha: number) {',
              '  ctx.save();',
              '  ctx.translate(c.x, c.y);',
              '  ctx.scale(1, ry / rx);',
              '  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx * 1.3);',
              '  g.addColorStop(0, `rgba(${rgb},${alpha})`);',
              '  g.addColorStop(1, `rgba(${rgb},0)`);',
              '  ctx.fillStyle = g;',
              '  ctx.beginPath(); ctx.arc(0, 0, rx * 1.3, 0, Math.PI * 2); ctx.fill();',
              '  ctx.restore();',
              '}',
              '',
            ].join('\n');
            if (!fs.includes('function blush(')) {
              fs = fs.replace(
                'function glow(ctx: CanvasRenderingContext2D, draw: () => void, blur: number, color = "rgba(255,255,255,.8)") {',
                blush + 'function glow(ctx: CanvasRenderingContext2D, draw: () => void, blur: number, color = "rgba(255,255,255,.8)") {'
              );
            }
            const bunnyOld = `  cheeks.forEach(c => {\n    ctx.save();\n    ctx.filter = \`blur(\${Math.max(5, f.width * .035)}px)\`;\n    ellipse(ctx, c, f.width * .105, f.height * .058, "rgba(255,80,145,.32)");\n    ctx.restore();\n  });`;
            const bunnyNew = '  cheeks.forEach(c => blush(ctx, c, f.width * .105, f.height * .058, "255,80,145", .32));';
            if (!fs.includes(bunnyOld)) throw new Error('Bunny cheeks block not found');
            fs = fs.replace(bunnyOld, bunnyNew);
            const makeupOld = `  [-1, 1].forEach(side => {\n    const c = { x: f.cx + side * f.width * .255, y: cheekY };\n    ctx.save();\n    ctx.filter = \`blur(\${Math.max(5, f.width * .035)}px)\`;\n    ellipse(ctx, c, f.width * .12, f.height * .065, \`rgba(255,48,119,\${strong ? .30 : .20})\`);\n    ctx.restore();\n  });`;
            const makeupNew = `  [-1, 1].forEach(side => {\n    const c = { x: f.cx + side * f.width * .255, y: cheekY };\n    blush(ctx, c, f.width * .12, f.height * .065, "255,48,119", strong ? .30 : .20);\n  });`;
            if (!fs.includes(makeupOld)) throw new Error('Makeup cheeks block not found');
            fs = fs.replace(makeupOld, makeupNew);
            const featherOld = `    const s = soft.getContext("2d")!;\n    s.filter = \`blur(\${feather}px)\`;\n    s.drawImage(mask, 0, 0);`;
            const featherNew = `    const s = soft.getContext("2d")!;\n    blurInto(s, mask, feather, w, h);`;
            if (!fs.includes(featherOld)) throw new Error('featheredFill block not found');
            fs = fs.replace(featherOld, featherNew);
            await putFile('client/src/features/beauty/FaceEffects.ts', fs, face.sha, 'fix: make face beauty effects iPhone safe');

            let pipeline = await getFile('client/src/features/beauty/BeautyPipeline.ts');
            let ps = pipeline.content;
            ps = ps.replace(
              'import { normalizeBeautyConfig } from "./BeautyConfig";\n',
              'import { normalizeBeautyConfig } from "./BeautyConfig";\nimport { SUPPORTS_CTX_FILTER, blurInto } from "./canvasBlur";\n'
            );
            const eyeOld = `      ctx.save();\n      ctx.filter = \`blur(\${Math.max(5, f.width * .035)}px)\`;\n      ellipse(ctx, { x: e.x, y: e.y + f.height * .048 }, f.width * .105, f.height * .035, \`rgba(255,205,185,\${.035 + c.darkCircles * .08})\`);\n      ctx.restore();`;
            const eyeNew = `      const glow = document.createElement("canvas");\n      glow.width = w; glow.height = h;\n      const gctx = glow.getContext("2d");\n      if (gctx) {\n        ellipse(gctx, { x: e.x, y: e.y + f.height * .048 }, f.width * .105, f.height * .035, \`rgba(255,205,185,\${.035 + c.darkCircles * .08})\`);\n        const blurred = document.createElement("canvas");\n        blurred.width = w; blurred.height = h;\n        const bctx = blurred.getContext("2d");\n        if (bctx) {\n          if (SUPPORTS_CTX_FILTER) {\n            bctx.filter = \`blur(\${Math.max(5, f.width * .035).toFixed(1)}px)\`;\n            bctx.drawImage(glow, 0, 0);\n            bctx.filter = "none";\n          } else {\n            blurInto(bctx, glow, Math.max(5, f.width * .035), w, h);\n          }\n          ctx.drawImage(blurred, 0, 0);\n        }\n      }`;
            if (!ps.includes(eyeOld)) throw new Error('BeautyPipeline dark circles block not found');
            ps = ps.replace(eyeOld, eyeNew);
            await putFile('client/src/features/beauty/BeautyPipeline.ts', ps, pipeline.sha, 'fix: make beauty pipeline iPhone safe');

            core.info('Beauty blur compatibility changes applied.');
