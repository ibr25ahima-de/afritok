name: Build BiYaloxi Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - '.github/workflows/biyaloxi-android.yml'
      - 'client/public/biyaloxi-icon-512.png'
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.18.3'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web shell
        run: pnpm build
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Apply BiYaloxi Android launcher icons
        run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source=Image.open('client/public/biyaloxi-icon-512.png').convert('RGBA')
          root=Path('android/app/src/main/res')
          for density,size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              target=root/f'mipmap-{density}'
              target.mkdir(parents=True,exist_ok=True)
              for name in ('ic_launcher.png','ic_launcher_round.png','ic_launcher_foreground.png'):
                  source.resize((size,size),Image.Resampling.LANCZOS).save(target/name)
          PY
      - name: Compile Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: BiYaloxi-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
