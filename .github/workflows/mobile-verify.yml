name: Afritok Mobile Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mobile-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-web-and-capacitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check mobile dependency consistency
        run: node scripts/verify-mobile-config.mjs

      - name: Type check
        run: pnpm check

      - name: Build web application
        run: pnpm build

      - name: Verify Capacitor configuration
        run: npx cap doctor

      - name: Generate Android project and sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate iOS project and sync
        run: |
          npx cap add ios --packagemanager SPM
          npx cap sync ios

      - name: Upload generated mobile projects
        uses: actions/upload-artifact@v4
        with:
          name: afritok-mobile-projects-${{ github.sha }}
          path: |
            android/
            ios/
          if-no-files-found: error
          retention-days: 7
