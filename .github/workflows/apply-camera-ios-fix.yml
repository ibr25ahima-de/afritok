name: Apply iPhone camera compatibility fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix iPhone camera orientation and Safari recording format'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply requested iPhone fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('client/src/components/CameraRecorder.tsx')
          s = p.read_text()
          old_camera = '''          width: { ideal: 1280 },
          height: { ideal: 720 },'''
          new_camera = '''          width: { ideal: 720 },
          height: { ideal: 1280 },
          frameRate: { ideal: 30 },'''
          if old_camera not in s:
              raise SystemExit('camera constraints block not found')
          s = s.replace(old_camera, new_camera, 1)

          old_mime = '''      "video/webm;codecs=vp9",
      "video/webm;codecs=vp8",
      "video/webm",
    ].find((type) => MediaRecorder.isTypeSupported(type));'''
          new_mime = '''      "video/webm;codecs=vp9",
      "video/webm;codecs=vp8",
      "video/webm",
      "video/mp4",
    ].find((type) => MediaRecorder.isTypeSupported(type));'''
          if old_mime not in s:
              raise SystemExit('MediaRecorder MIME block not found')
          s = s.replace(old_mime, new_mime, 1)
          p.write_text(s)
          PY

      - name: Commit source fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/CameraRecorder.tsx
          git rm .github/workflows/apply-camera-ios-fix.yml
          git commit -m "Fix iPhone camera orientation and Safari recording format"
          git push origin main
